[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igl3dm"
version = "0.1.0"
description = "One generated multiview atlas to a measured, approximate 3D visual hull"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=9.5"]

[project.scripts]
igl3dm = "igl3dm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
